name: Serene
options:
  bundleIdPrefix: com.serene
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: Serene/Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: false

targets:
  Serene:
    type: application
    platform: iOS
    sources:
      - path: Serene
        excludes:
          - Resources/Fonts/**
    resources:
      - path: Serene/Resources/Assets.xcassets
      - path: Serene/Resources/Fonts
        buildPhase: resources
      - path: Serene/Resources/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serene.app
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Serene/Resources/Info.plist
